<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="webSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" rx="16" fill="url(#webBg)" />

  <!-- Code matrix background aesthetic -->
  <g opacity="0.07" font-family="monospace" font-size="14" fill="#a7f3d0">
    <text x="60" y="80">&lt;html&gt;&lt;body&gt;&lt;div class="app"&gt;</text>
    <text x="60" y="110">const server = createServer(async (req, res) =&gt; {</text>
    <text x="60" y="140">  const response = await handleRequest(req);</text>
    <text x="60" y="170">  return json(response.data);</text>
    <text x="60" y="200">});</text>
    <text x="60" y="650">&lt;Component state={reactive} /&gt;</text>
    <text x="60" y="680">export default defineAsyncComponent();</text>
    <text x="60" y="710">npm run build --production</text>
  </g>

  <!-- Left Spine -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="url(#webSpine)" />
  <line x1="36" y1="0" x2="36" y2="800" stroke="#000000" stroke-width="2" stroke-opacity="0.5" />

  <!-- Borders -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Category Pill -->
  <g transform="translate(300, 120)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="2">WEB DEVELOPMENT</text>
  </g>

  <!-- Central Graphic: Code Browser Window -->
  <g transform="translate(150, 220)">
    <rect width="300" height="200" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="24" cy="20" r="6" fill="#ef4444" />
    <circle cx="44" cy="20" r="6" fill="#f59e0b" />
    <circle cx="64" cy="20" r="6" fill="#10b981" />
    <line x1="0" y1="36" x2="300" y2="36" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Code Brackets Icon -->
    <path d="M 110 90 L 80 120 L 110 150" fill="none" stroke="url(#codeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 190 90 L 220 120 L 190 150" fill="none" stroke="url(#codeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <line x1="160" y1="85" x2="140" y2="155" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Title & Author -->
  <g transform="translate(300, 510)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">PEMROGRAMAN</text>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#34d399" letter-spacing="0.5">WEB MODERN</text>
    <line x1="-50" y1="64" x2="50" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">John Doe</text>
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Panduan Praktis Arsitektur Web Skalabel</text>
  </g>

  <!-- Footer -->
  <g transform="translate(300, 725)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669" letter-spacing="3">EDISI KHUSUS PERPUSTAKAAN</text>
  </g>
</svg>
