<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="algoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="40%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="algoSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="algoGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" rx="16" fill="url(#algoBg)" />

  <!-- Left Spine -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="url(#algoSpine)" />
  <line x1="36" y1="0" x2="36" y2="800" stroke="#000000" stroke-width="2" stroke-opacity="0.5" />

  <!-- Borders -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Category Pill -->
  <g transform="translate(300, 120)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" letter-spacing="2">COMPUTER SCIENCE</text>
  </g>

  <!-- Central Graphic: Binary Tree / Graph Structure -->
  <g transform="translate(300, 280)">
    <!-- Tree edges -->
    <line x1="0" y1="-50" x2="-80" y2="20" stroke="#a78bfa" stroke-width="2.5" />
    <line x1="0" y1="-50" x2="80" y2="20" stroke="#a78bfa" stroke-width="2.5" />
    <line x1="-80" y1="20" x2="-120" y2="90" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="4 2" />
    <line x1="-80" y1="20" x2="-40" y2="90" stroke="#a78bfa" stroke-width="2.5" />
    <line x1="80" y1="20" x2="40" y2="90" stroke="#a78bfa" stroke-width="2.5" />
    <line x1="80" y1="20" x2="120" y2="90" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="4 2" />

    <!-- Root Node -->
    <circle cx="0" cy="-50" r="22" fill="#7c3aed" stroke="#ddd6fe" stroke-width="2.5" filter="url(#algoGlow)" />
    <text x="0" y="-44" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff">A</text>

    <!-- Level 1 Nodes -->
    <circle cx="-80" cy="20" r="18" fill="url(#nodeGrad)" stroke="#fef3c7" stroke-width="2" />
    <text x="-80" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">B</text>

    <circle cx="80" cy="20" r="18" fill="url(#nodeGrad)" stroke="#fef3c7" stroke-width="2" />
    <text x="80" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">C</text>

    <!-- Level 2 Nodes -->
    <circle cx="-120" cy="90" r="14" fill="#3b82f6" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="-120" y="94" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">D</text>

    <circle cx="-40" cy="90" r="14" fill="#10b981" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="-40" y="94" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">E</text>

    <circle cx="40" cy="90" r="14" fill="#10b981" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="40" y="94" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">F</text>

    <circle cx="120" cy="90" r="14" fill="#ec4899" stroke="#fbcfe8" stroke-width="1.5" />
    <text x="120" y="94" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">G</text>
  </g>

  <!-- Title & Author -->
  <g transform="translate(300, 490)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">STRUKTUR DATA</text>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#c084fc" letter-spacing="0.5">&amp; ALGORITMA</text>
    <line x1="-50" y1="64" x2="50" y2="64" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Alan Turing</text>
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Kompleksitas Komputasi, Graf &amp; Pohon Pencarian</text>
  </g>

  <!-- Footer -->
  <g transform="translate(300, 725)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing="3">EDISI KHUSUS PERPUSTAKAAN</text>
  </g>
</svg>
